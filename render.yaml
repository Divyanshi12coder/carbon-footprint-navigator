# Render Blueprint: Dockerised FastAPI backend.
# The frontend is deployed separately on Vercel.

services:
  - type: web
    name: carbon-footprint-navigator-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

      - key: AI_PROVIDER
        value: demo

      - key: AI_API_KEY
        sync: false

      - key: AI_MODEL
        value: claude-opus-5-5

      - key: SEED_EMISSION_FACTORS
        value: "true"

      - key: SEED_DEMO_DATA
        value: "true"
